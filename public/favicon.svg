<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- The stroke defaults to a dark slate so the mark stays visible on the
       light browser tabs most users have; it flips to cream in dark UI.
       Defaulting to the light colour would make it invisible in any UA that
       ignores the media query, so dark is the safer default. -->
  <style>
    .stroke { stroke: #2B3A67; }
    .fill   { fill:   #2B3A67; }
    @media (prefers-color-scheme: dark) {
      .stroke { stroke: #FAF7F2; }
      .fill   { fill:   #FAF7F2; }
    }
  </style>
  <ellipse class="stroke" cx="32" cy="32" rx="26" ry="10" transform="rotate(-24 32 32)" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="32" r="6" fill="#D97757"/>
  <circle class="fill" cx="52" cy="22" r="2.5"/>
</svg>
