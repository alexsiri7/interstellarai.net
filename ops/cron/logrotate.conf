# logrotate config for the archon pipeline cron logs (ops/cron/crontab).
# Runs hourly from the user crontab, no root:
#   7 * * * * /usr/sbin/logrotate --state /home/asiri/.logrotate.state /mnt/ext-fast/interstellarai.net/ops/cron/logrotate.conf
# The state file stays outside the repo. Paths are absolute because logrotate
# expands no `~` and the crontab already pins the checkout location.
# copytruncate: the scripts hold the log open via cron's `>>` redirect, so the
# file is truncated in place rather than renamed out from under them.

/home/asiri/.local/state/archon-cron/logs/issue-pickup.log
/home/asiri/.local/state/archon-cron/logs/pr-maintenance.log
/home/asiri/.local/state/archon-cron/logs/pr-maintenance-errors.log
/home/asiri/.local/state/archon-cron/logs/pr-review.log
/home/asiri/.local/state/archon-cron/logs/pipeline-health.log
/home/asiri/.local/state/archon-cron/logs/daily-release.log
/home/asiri/.local/state/archon-cron/logs/db-backup.log
/home/asiri/.local/state/archon-cron/logs/restore-test.log
/home/asiri/.local/state/archon-cron/logs/sweep-audits.log
/home/asiri/.local/state/archon-cron/logs/system-maintenance.log
/home/asiri/.local/state/archon-cron/logs/tool-freshness.log
/home/asiri/.local/state/archon-cron/logs/ops-self-update.log
{
    size 10M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
