# /etc/systemd/system/user@.service.d/20-oomd-pressure-limit.conf — installed by ops/host/install.sh (step 9).
# (File name kept from the earlier 80%-limit version so a re-run replaces it in place.)
#
# Ubuntu ships /usr/lib/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf
# (ManagedOOMMemoryPressure=kill, ManagedOOMMemoryPressureLimit=50%): systemd-oomd
# SIGKILLs the biggest-reclaiming child cgroup of user@<uid>.service (a whole
# tmux scope) once that unit's memory PSI stays above the limit for 20s.
#
# On this host that pressure is never a memory shortage. It is reclaim waiting
# on writeback to the slow root SSD (sdb) while cargo builds fill the 50+ GB
# page cache:
#   2026-09-26  75% pressure, 59 GB available  -> killed claude + NAS extraction
#   2026-09-27  96% pressure, 57 GB available  -> killed claude + 42 procs,
#               after the limit had been raised to 80% (#132)
# No threshold separates those stalls from a real OOM, so pressure-kill is off
# for user managers. `auto` = oomd does not monitor the unit (the systemd
# default); this file sorts after 10-… and overrides its `kill`. The kernel
# OOM killer still handles a real out-of-memory.
#
# Scope: every user@<uid>.service. On this host that is asiri (1000) and gdm
# (120); the archon factory has no user manager (system units, no linger).
# Takes effect on `systemctl daemon-reload` + `systemctl restart systemd-oomd`;
# never restart user@<uid>.service for it.
[Service]
ManagedOOMMemoryPressure=auto
