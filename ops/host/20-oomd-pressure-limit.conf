# /etc/systemd/system/user@.service.d/20-oomd-pressure-limit.conf — installed by ops/host/install.sh (step 9).
# Ubuntu ships 10-oomd-user-service-defaults.conf (ManagedOOMMemoryPressure=kill,
# ManagedOOMMemoryPressureLimit=50%): systemd-oomd kills the biggest-reclaiming
# child cgroup of user@<uid>.service once that unit's memory PSI ("full" avg10)
# stays above 50% for the duration (20s on this host). On 2026-09-26 it killed a
# tmux pane running claude and the NAS extraction at 75% pressure with 59 GB
# available: the stall was writeback to the slow root SSD, not a shortage.
# This file sorts after 10-… and so overrides the limit; the duration is left
# at the oomd default. Takes effect on `systemctl daemon-reload` (oomd reads
# the property from the unit); never restart user@<uid>.service for it.
[Service]
ManagedOOMMemoryPressureLimit=80%
