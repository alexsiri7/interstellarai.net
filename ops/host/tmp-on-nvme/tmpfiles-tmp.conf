# /etc/tmpfiles.d/tmp.conf — installed by ops/host/install.sh (step 12), issue #133.
# Same name as /usr/lib/tmpfiles.d/tmp.conf, so it replaces that file (Ubuntu:
# "D /tmp 1777 root root 30d"). systemd-tmpfiles-clean.timer (daily) removes
# /tmp entries nothing accessed, modified or changed for 2 days; the boot-time
# emptying of /tmp (D + --remove) is unchanged.
D /tmp 1777 root root 2d
# Long-lived session sockets and dirs are never aged: an idle tmux server or
# ssh-agent must keep its socket, a paused Claude session its scratchpad.
# (systemd-private-*, snap-private-tmp and .X11-unix have their own rules in
# /usr/lib/tmpfiles.d, which still apply.)
x /tmp/tmux-*
x /tmp/ssh-*
x /tmp/claude-*
