# /etc/sysctl.d/60-dirty-bytes.conf — installed by ops/host/install.sh (step 10).
# The kernel's default dirty limits are ratios of RAM (10% / 20% of ~62 GB), so
# up to ~12 GB of unwritten data could pile up in front of the root SSD
# (Kingston SA400, tens of MB/s sustained). Flushing that stalled every writer
# long enough for systemd-oomd to see memory pressure (2026-09-26), and the
# shutdown sat 5 minutes in "(sd-sync) waiting for writeback".
# Background writeback starts at 256 MiB; writers are throttled at 1 GiB.
# Setting the *_bytes knobs zeroes the matching *_ratio ones.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
