# /etc/tmpfiles.d/cargo-tmp-build-dir.conf — installed by ops/host/install.sh (step 11).
# Review checkouts under /tmp (`git worktree add /tmp/<name>` + cargo test)
# wrote 9-16 GB of Cargo build output each to / (#133): cargo reads
# .cargo/config.toml only from the build's cwd and its ancestors, so the
# per-workspace config of #131 never reaches /tmp. This one does, for every
# user. {cargo-cache-home} is each user's $CARGO_HOME: archon's is on
# /mnt/ext-fast already; asiri's ~/.cargo/tmp-build is a symlink to
# /mnt/ext-fast kept by ensure_cargo_tmp_build_link (pipeline-health-cron.sh).
# `x` keeps /tmp's 30-day aging off it; root owns the dir so no user can
# swap the config out for everyone else's builds.
d  /tmp/.cargo              0755 root root - -
x  /tmp/.cargo
f+ /tmp/.cargo/config.toml  0644 root root - # Managed by ops/host/cargo-tmp-build-dir.conf (issue #133): builds under /tmp keep their build output in {cargo-cache-home}/tmp-build.\n[build]\nbuild-dir = "{cargo-cache-home}/tmp-build/{workspace-path-hash}"\n
