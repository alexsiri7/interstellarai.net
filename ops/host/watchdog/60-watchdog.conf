# Managed by interstellarai.net ops/host/install.sh (ops/host/watchdog/60-watchdog.conf).
#
# PID 1 arms the hardware watchdog (iTCO_wdt, loaded by itco-wdt.service) and
# pings it every 15 s; a kernel or PID 1 hang longer than 30 s resets the board.
# During the final phase of a reboot (systemd-shutdown: unmount, sync, the
# reboot() call itself) the watchdog is re-armed for 3 min and deliberately
# left running into the reset path, so a reboot that hangs there gets a
# hardware reset instead of sitting black until someone power-cycles it
# (2026-10-05 and 2026-10-15, see ops/host/README.md#hardware-watchdog).
# KExecWatchdogSec is left off: kexec-tools is not installed on this host.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=3min
