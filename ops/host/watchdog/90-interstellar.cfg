# Managed by interstellarai.net ops/host/install.sh (ops/host/watchdog/90-interstellar.cfg).
#
# grub-mkconfig sources /etc/default/grub first and then every
# /etc/default/grub.d/*.cfg in glob order, so this value replaces the one in
# /etc/default/grub (which still reads "quiet splash reboot=pci"; leave it).
# install.sh runs update-grub when this file changes or /boot/grub/grub.cfg
# does not match it yet. Takes effect at the next boot.
#
#   no `splash`  plymouth-quit-wait hung all day on 2026-10-16 and left the
#                system in "starting"; without splash Ubuntu's 10_linux also
#                drops vt.handoff=7.
#   reboot=efi   reboot through the EFI ResetSystem runtime service.
#                reboot=pci (hand-added 2026-10-06) did not stop the next
#                reboot hanging (2026-10-15).
GRUB_CMDLINE_LINUX_DEFAULT="quiet reboot=efi"
